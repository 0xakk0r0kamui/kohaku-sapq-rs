[workspace]
members = [
    "fork-kit",
    "merkle-tree",
    "stealth",
    "rpc-provider",
    "tor-rpc",
    "tornadocash/circuit",
    "tornadocash/core",
    "tornadocash/keychain",
    "tornadocash/paymaster",
    "tornadocash/relayer",
    "tornadocash/syncer",
    "tornadocash/wasm",
    "userop-kit",
]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/ethereum/kohaku-rs"

[workspace.lints.clippy]
cast_possible_truncation = { level = "allow" }
missing_errors_doc = { level = "allow" }
pedantic = { level = "warn", priority = -1 }
result_large_err = { level = "allow" }

[workspace.dependencies]
alloy = "2.4.1"
alloy-primitives = { version = "1.7", default-features = false }
alloy-sol-types = "1.7"
anyhow = "1.0.104"
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
async-trait = "0.1.92"
blake-hash = "0.2.0"
brotli = "9.0.0"
cfg_aliases = "0.2.2"
criterion = "0.8.2"
flate2 = "1.1"
futures = "0.3"
hex = "0.4.3"
insta = "1.48.0"
js-sys = "0.3.85"
kohaku-fork-kit = { path = "fork-kit" }
kohaku-stealth = { path = "stealth" }
kohaku-merkle-tree = { version = "0.1.0", path = "merkle-tree" }
kohaku-rpc-provider = { version = "0.0.1", path = "rpc-provider" }
kohaku-tor-rpc = { version = "0.0.1", path = "tor-rpc" }
kohaku-tornadocash-circuit = { version = "0.1.0", path = "tornadocash/circuit" }
kohaku-tornadocash = { version = "0.1.0", path = "tornadocash/core" }
kohaku-tornadocash-keychain = { version = "0.0.1", path = "tornadocash/keychain" }
kohaku-tornadocash-paymaster = { version = "0.0.1", path = "tornadocash/paymaster" }
kohaku-tornadocash-relayer = { version = "0.0.1", path = "tornadocash/relayer" }
kohaku-tornadocash-syncer = { version = "0.0.1", path = "tornadocash/syncer" }
kohaku-userop-kit = { version = "0.0.1", path = "userop-kit" }
num-bigint = "0.5.1"
num-traits = "0.2.19"
postcard = "1.1.3"
pqsa-core = { git = "https://github.com/namnc/pq-stealth-scheme3-public.git", tag = "v0.1.0" }
pqsa-per-payment = { git = "https://github.com/namnc/pq-stealth-scheme3-public.git", tag = "v0.1.0" }
rand = "0.10.2"
rayon = "1.12"
redb = "4.3.0"
reqwest = "0.13.4"
ruint = "1.20.0"
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.108"
wasm-bindgen-test = "=0.3.58"
websnark-rs = "0.8.0"
zeroize = "1.9.0"
